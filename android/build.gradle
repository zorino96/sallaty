// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force every Android subproject (Capacitor core + plugins) to use the build-tools
// version we actually have installed (36.0.0). AGP 8.2.1 would otherwise auto-pin
// to 34.0.0 and try to install it into Program Files (write-protected).
subprojects { sp ->
    sp.plugins.withId('com.android.application') {
        sp.android.buildToolsVersion = '36.0.0'
    }
    sp.plugins.withId('com.android.library') {
        sp.android.buildToolsVersion = '36.0.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
