<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C77E"/>
      <stop offset="55%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#B8923F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#F0D89A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0D89A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Adaptive-icon safe zone: keep art within the central ~66%. Everything
       below is centred and scaled to survive Android's circular/squircle mask. -->
  <g transform="translate(256 268) scale(0.62) translate(-256 -256)">

    <!-- soft halo behind the dome -->
    <circle cx="256" cy="210" r="180" fill="url(#halo)"/>

    <!-- faint 8-pointed star behind -->
    <g fill="#D4AF6A" opacity="0.18" transform="translate(256 206)">
      <polygon points="0,-150 34,-34 150,0 34,34 0,150 -34,34 -150,0 -34,-34"/>
      <polygon points="0,-150 34,-34 150,0 34,34 0,150 -34,34 -150,0 -34,-34" transform="rotate(45)"/>
    </g>

    <!-- left minaret -->
    <g fill="url(#gold)">
      <rect x="120" y="250" width="26" height="150" rx="6"/>
      <path d="M120 254 q13 -30 26 0 Z"/>
      <circle cx="133" cy="212" r="20"/>
      <path d="M133 178 l5 26 h-10 Z"/>
      <rect x="118" y="300" width="30" height="6" opacity="0.65"/>
      <rect x="118" y="340" width="30" height="6" opacity="0.65"/>
    </g>

    <!-- right minaret -->
    <g fill="url(#gold)">
      <rect x="366" y="250" width="26" height="150" rx="6"/>
      <path d="M366 254 q13 -30 26 0 Z"/>
      <circle cx="379" cy="212" r="20"/>
      <path d="M379 178 l5 26 h-10 Z"/>
      <rect x="364" y="300" width="30" height="6" opacity="0.65"/>
      <rect x="364" y="340" width="30" height="6" opacity="0.65"/>
    </g>

    <!-- central onion dome -->
    <path d="M176 300
             C 176 214 206 150 256 104
             C 306 150 336 214 336 300 Z"
          fill="url(#gold)"/>

    <!-- crescent finial on the dome -->
    <g transform="translate(256 86)">
      <circle cx="0" cy="0" r="20" fill="url(#gold)"/>
      <circle cx="7" cy="-3" r="16" fill="#0E2421"/>
    </g>

    <!-- mosque body -->
    <rect x="168" y="300" width="176" height="118" rx="10" fill="url(#gold)"/>

    <!-- central mihrab arch (cut-out) -->
    <path d="M236 418 v-58 a20 20 0 0 1 40 0 v58 Z" fill="#0E2421"/>
    <!-- side arches -->
    <path d="M188 418 v-34 a13 13 0 0 1 26 0 v34 Z" fill="#0E2421" opacity="0.9"/>
    <path d="M298 418 v-34 a13 13 0 0 1 26 0 v34 Z" fill="#0E2421" opacity="0.9"/>

    <!-- base platform -->
    <rect x="150" y="418" width="212" height="20" rx="8" fill="url(#gold)"/>
  </g>
</svg>
