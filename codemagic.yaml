# Codemagic CI — builds the iOS app on a hosted Mac and ships it to TestFlight.
#
# Why this file exists: the app is developed on Windows, and only macOS can
# produce a signed .ipa. Codemagic rents a Mac for the length of the build.
#
# ── One-time setup in the Codemagic UI (cannot be done from this repo) ──
#  1. Connect this repository to Codemagic.
#  2. App Store Connect → Users and Access → Integrations → create an API key
#     with the "App Manager" role, and download its .p8 (downloadable ONCE).
#  3. Codemagic → Teams → Integrations → Developer Portal → add that key and
#     name it exactly `sallaty-appstore` (or change the name in both places
#     marked below).
# The private key is deliberately NOT stored in this repository.

workflows:
  ios-appstore:
    name: Sallaty iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.selati.app
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App

    integrations:
      app_store_connect: sallaty-appstore   # ← must match the key name in Codemagic

    triggering:
      # Manual only. Prayer-time data changes land on main far more often than
      # we want to burn a TestFlight build.
      events: []

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build the web app and sync it into the iOS project
        script: |
          npx next build
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set the build number
        script: |
          # App Store Connect rejects a build number it has already seen, so we
          # ride Codemagic's own monotonically increasing counter.
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"

      - name: Fetch signing profiles and build the IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight only. Promoting a build to the public App Store
        # stays a deliberate, human decision in App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
