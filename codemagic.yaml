# Codemagic CI — builds the iOS app on a hosted Mac and ships it to TestFlight.
#
# Why this file exists: the app is developed on Windows, and only macOS can
# produce a signed .ipa. Codemagic rents a Mac for the length of the build.
#
# ── One-time setup in the Codemagic UI (cannot be done from this repo) ──
#  1. Connect this repository to Codemagic.
#  2. App Store Connect → Users and Access → Integrations → create an API key
#     with the **Admin** role, and download its .p8 (downloadable ONCE).
#     Admin, not App Manager: this account had no distribution certificate, and
#     creating one through Apple's API is an Admin-only operation. App Manager
#     is enough afterwards, but not to bootstrap.
#  3. Codemagic → Teams → Integrations → Developer Portal → add that key and
#     name it exactly `sallaty-appstore-admin` (or change the name in both
#     places marked below).
#  4. Generate an RSA key (`openssl genrsa -out certificate_private_key.pem
#     2048`) and add its contents to this app's environment variables as a
#     SECURE variable named CERTIFICATE_PRIVATE_KEY, in group `appstore`.
#     Apple issues a certificate around a private key you supply; reusing one
#     key across builds is what stops every build minting a new certificate.
# Neither private key is stored in this repository.

workflows:
  ios-appstore:
    name: Sallaty iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - appstore          # supplies the secure CERTIFICATE_PRIVATE_KEY
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: com.selati.app

    integrations:
      app_store_connect: sallaty-appstore-admin   # ← must match the key name in Codemagic

    triggering:
      # Manual only. Prayer-time data changes land on main far more often than
      # we want to burn a TestFlight build.
      events: []

    scripts:
      - name: Create the signing certificate and provisioning profile
        script: |
          # The `ios_signing` environment block only *looks up* profiles that
          # already exist; on a brand-new Apple account there are none, and the
          # build dies with "No matching profiles found". `--create` is what
          # actually mints the distribution certificate and the profile — and
          # minting a certificate is why the API key needs the Admin role.
          #
          # This step only fetches and unlocks them. Writing them into the Xcode
          # project happens later, after pod install — see the note there.
          #
          # --certificate-key is not optional: a certificate is a public key
          # signed by Apple, so the tool needs a private key to build one
          # around. Without it the command prints "Cannot save Signing
          # Certificates without certificate private key" and creates nothing.
          # Keeping the SAME key in an environment variable across builds is
          # what makes this repeatable — a key generated per build would mint a
          # fresh certificate every time and hit Apple's per-account limit.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates

      - name: Install npm dependencies
        script: npm ci

      - name: Build the web app and sync it into the iOS project
        script: |
          npx next build
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set the build number
        script: |
          # App Store Connect rejects a build number it has already seen, so we
          # ride Codemagic's own monotonically increasing counter.
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"

      - name: Apply the signing profile to the Xcode project
        script: |
          # This has to come after `cap sync` and `pod install`, not before:
          # both rewrite the Xcode project and its xcconfigs, and whichever runs
          # last wins. Applying the profile earlier looked fine in the log and
          # still ended in `"App" requires a provisioning profile` at archive
          # time, because the settings had been overwritten in between.
          xcode-project use-profiles

      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight only. Promoting a build to the public App Store
        # stays a deliberate, human decision in App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
